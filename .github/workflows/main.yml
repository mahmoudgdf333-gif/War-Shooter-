name: Build War Shooter APK

on:
workflow_dispatch:
push:
branches: [main, master]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-22.04
timeout-minutes: 120

env:
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

steps:
  - name: Checkout game
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Linux dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip build-essential \
        autoconf automake libtool pkg-config \
        zlib1g-dev libncurses5-dev libncursesw5-dev \
        cmake libffi-dev libssl-dev

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      accept-android-sdk-licenses: true
      packages: ''

  - name: Configure SDK for Buildozer
    shell: bash
    run: |
      set -euxo pipefail

      mkdir -p "$ANDROID_HOME"
      sdkmanager --sdk_root="$ANDROID_HOME" --licenses
      sdkmanager --sdk_root="$ANDROID_HOME" --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

      test -x "$ANDROID_HOME/platform-tools/adb"
      ls -la "$ANDROID_HOME/build-tools"

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip
      python -m pip install buildozer cython==0.29.36

  - name: Build APK
    run: buildozer -v android debug

  - name: Upload APK
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: WarShooter-APK
      path: bin/*.apk
      if-no-files-found: warn
